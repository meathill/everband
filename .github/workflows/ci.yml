name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  # 单元与集成测试禁止真实外呼
  EMAIL_MODE: mock
  DYQR_MODE: mock

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/setup@v2
        with:
          runtime: node@24
          cache: true
          install: false

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - name: 格式与 lint 检查
        run: pnpm run format:ci

      - name: 类型检查
        run: pnpm run typecheck

      - name: 单元测试
        run: pnpm run test

      - name: 构建
        run: pnpm run build

      - name: 安装 Playwright 浏览器
        run: pnpm exec playwright install chromium --with-deps

      - name: 应用本地 D1 迁移
        run: pnpm -C apps/app exec wrangler d1 migrations apply everband --local

      # shell env 不会覆盖 wrangler vars；从公开模板生成仅供本次 run 使用的本地 Worker 配置
      - name: 准备 E2E Worker 环境
        run: |
          cp apps/app/.dev.vars.example apps/app/.dev.vars
          cp apps/tasks/.dev.vars.example apps/tasks/.dev.vars

      - name: E2E 测试
        run: pnpm run test:e2e
